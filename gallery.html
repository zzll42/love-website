<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="我们的图库：全部照片和视频。">
<title>我们的图库 💕 我们的爱情记录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="gallery">

<!-- 顶部导航 -->
<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html">💕 我们的记录</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="meetings.html">见面记录</a>
      <a href="gallery.html" class="active">图库</a>
    </div>
  </div>
</nav>

<!-- 页面标题 -->
<header class="page-hero">
  <h1 class="hero-title">我们的图库</h1>
  <p class="section-sub">全部照片和视频，都在这里</p>
</header>

<section class="section">
  <!-- 工具栏：筛选 + 添加照片 -->
  <div class="gallery-toolbar">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部 <span class="filter-count" id="countAll">0</span></button>
      <button class="filter-btn" data-filter="photo">📷 照片 <span class="filter-count" id="countPhoto">0</span></button>
      <button class="filter-btn" data-filter="video">🎬 视频 <span class="filter-count" id="countVideo">0</span></button>
    </div>
    <label class="upload-btn">
      ➕ 添加照片/视频
      <input type="file" id="addFiles" accept="image/*,video/*" multiple hidden>
    </label>
  </div>

  <p class="gallery-notice">
    💡 想加照片？点右上角"➕ 添加照片/视频"就可以往图库里加。注意：你加的照片<b>只保存在你自己的设备上</b>，其他访客看不到（网站是静态托管，没有云端相册服务）。如果你希望所有人都能看到新照片，告诉张焕林，让他把原图放进"照片"文件夹重新上传即可。
  </p>
  <p class="upload-tip" id="uploadTip" hidden></p>

  <!-- 全部照片和视频 -->
  <div class="gallery-grid" id="galleryGrid"></div>
</section>

<footer class="footer">
  <p>💕 用心记录我们的每一天 💕</p>
  <p id="footerCopy"></p>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
