<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="记录我们的爱情：两个人的合照、在一起的天数，以及每一次见面的回忆。">
<title>我们的爱情记录 💕</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">

<!-- 密码锁 -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="lock-heart">💕</div>
    <h2>这是我们的秘密小站</h2>
    <p class="lock-sub">输入我们的暗号才能进入</p>
    <input type="password" id="lockInput" placeholder="输入密码" maxlength="32" autocomplete="off">
    <button type="button" id="lockBtn">进入 💗</button>
    <p class="lock-error" id="lockError" hidden>密码不对，再想想～</p>
  </div>
</div>

<!-- 顶部导航 -->
<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html">💕 我们的记录</a>
    <div class="nav-links">
      <a href="index.html" class="active">首页</a>
      <a href="meetings.html">见面记录</a>
      <a href="gallery.html">图库</a>
      <a href="#" id="lockBtnNav" class="nav-lock" title="锁定网站">🔒</a>
    </div>
  </div>
</nav>

<!-- 首页大标题 -->
<header class="hero">
  <div class="hearts" aria-hidden="true">
    <span>💗</span><span>💕</span><span>💖</span><span>💘</span><span>💝</span><span>❤️</span>
  </div>
  <span class="hero-kicker">记录我们的每一个瞬间</span>
  <h1 class="hero-title">我们的爱情记录</h1>
  <p class="hero-names"><span id="boyName">···</span> 💕 <span id="girlName">···</span></p>
  <p class="hero-since" id="heroSince"></p>

  <div class="hero-counters">
    <div class="counter-card">
      <div class="counter-number" id="togetherDays">--</div>
      <div class="counter-label" id="togetherLabel">我们已经在一起</div>
    </div>
    <div class="counter-card">
      <div class="counter-number" id="nextMilestoneDays">--</div>
      <div class="counter-label" id="nextMilestoneLabel">距离下一个纪念日</div>
    </div>
    <div class="counter-card" id="nextMeetingCard" hidden>
      <div class="counter-number" id="nextMeetingDays">--</div>
      <div class="counter-label">距离下次见面（天）</div>
    </div>
  </div>
</header>

<!-- 关于我们 -->
<section class="section">
  <h2 class="section-title">关于我们</h2>
  <div class="about-grid" id="aboutGrid"></div>
</section>

<!-- 我们的纪念日 -->
<section class="section">
  <h2 class="section-title">我们的纪念日</h2>
  <p class="section-sub">每一个日子，都值得倒数与庆祝</p>
  <div class="birthday-grid" id="birthdayCards"></div>
  <div class="milestone-grid" id="milestoneList"></div>
</section>

<!-- 照片墙 -->
<section class="section">
  <h2 class="section-title">我们的照片墙</h2>
  <p class="section-sub">每一张照片，都是我们的故事</p>
  <div class="gallery" id="usGallery"></div>
  <div class="center"><a class="btn" href="gallery.html">查看全部照片和视频 💕</a></div>
</section>

<!-- 最近的见面 -->
<section class="section">
  <h2 class="section-title">最近的见面</h2>
  <p class="section-sub">每一次见面，都值得被记住</p>
  <div class="meetings-grid" id="recentMeetings"></div>
  <div class="center"><a class="btn" href="meetings.html">查看全部见面记录 💕</a></div>
</section>

<footer class="footer">
  <p>💕 用心记录我们的每一天 💕</p>
  <p id="footerCopy"></p>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
